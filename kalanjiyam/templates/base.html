<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kalanjiyam{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A breakthrough Siddha Knowledge Systems platform. Preserve and study traditional Siddha texts through collaborative proofing, digital preservation, and community-driven knowledge sharing.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}siddha, knowledge systems, traditional medicine, alchemy, yoga, spiritual knowledge, tamil literature, murugan, mayil, siddha texts, digital preservation{% endblock %}">
    <meta name="author" content="Kalanjiyam">
    <meta name="robots" content="{% block meta_robots %}index, follow{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:site_name" content="Kalanjiyam">
    <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='images/og-image.png') }}{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.og_title() }}">
    <meta name="twitter:description" content="{{ self.meta_description() }}">
    <meta name="twitter:image" content="{{ self.og_image() }}">
    <link rel="canonical" href="{{ request.url }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ asset('gen/style.css') }}">
    <link rel="stylesheet" href="{{ asset('gen/main.css') }}">
    {% block extra_css %}{% endblock %}
    {% block extra_head %}{% endblock %}
    <script>
      (function() {
        var fp = localStorage.getItem('device_fingerprint');
        if (!fp) {
          var match = document.cookie.match(new RegExp('(^| )device_fingerprint=([^;]+)'));
          if (match) {
            fp = match[2];
          } else {
            fp = 'fp-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
          }
          localStorage.setItem('device_fingerprint', fp);
        }
        var d = new Date();
        d.setTime(d.getTime() + (365*24*60*60*1000));
        document.cookie = "device_fingerprint=" + fp + "; expires=" + d.toUTCString() + "; path=/; SameSite=Lax";
      })();
    </script>
</head>
<body class="{% block body_class %}flex flex-col min-h-screen{% endblock %}">
    {% block body %}
    {% include 'include/header.html' %}
    
    <main class="flex-1 {% block main_class %}{% endblock %}">
        {% block main %}{% endblock %}
      </main>
    {% include 'include/footer.html' %}
    <script src="{{ asset('gen/main.js') }}"></script>
    <script src="https://unpkg.com/alpinejs@3.10.3/dist/cdn.min.js" defer></script>
    {% block extra_scripts %}{% endblock %}
    {% endblock %}
</body>
</html>
