version: '3.8'

services:
  kalanjiyam-dbsetup:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-dbsetup
    command: alembic stamp head && python -m kalanjiyam.seed.lookup && python -m kalanjiyam.seed.texts.gretil && python -m kalanjiyam.seed.dcs
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:kalanjiyam@kalanjiyam-db/kalanjiyam
      - KALANJIYAM_BOT_PASSWORD=insecure bot password
    depends_on:
      - kalanjiyam-db

  kalanjiyam-db:
    image: postgres:15
    container_name: kalanjiyam-db
    environment:
      - POSTGRES_DB=kalanjiyam
      - POSTGRES_USER=kalanjiyam
      - POSTGRES_PASSWORD=kalanjiyam
    volumes:
      - kalanjiyam-data:/var/lib/postgresql/data

volumes:
  kalanjiyam-data:

