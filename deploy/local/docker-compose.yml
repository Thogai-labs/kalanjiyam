version: '3.8'

services:
  kalanjiyam-web:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-web-dev
    ports:
      - host_ip: ${KALANJIYAM_HOST_IP}
        published: ${KALANJIYAM_DEV_HOST_PORT:-5001}
        target: 5000
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - GUNICORN_TIMEOUT=300
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - OPENSEARCH_URL=http://kalanjiyam-search:9200
    volumes:
      - ${PWD}/kalanjiyam/static/:/app/kalanjiyam/static/
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
      - kalanjiyam-search
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kalanjiyam-db:
    image: postgres:15
    container_name: kalanjiyam-db-dev
    environment:
      - POSTGRES_DB=kalanjiyam
      - POSTGRES_USER=kalanjiyam
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kalanjiyam}
    volumes:
      - kalanjiyam-data:/var/lib/postgresql/data

  kalanjiyam-redis:
    image: redis:7
    container_name: kalanjiyam-redis-dev

  kalanjiyam-celery:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-dev
    command: >
      celery -A kalanjiyam.tasks worker
      -Q default,ocr,low_priority,search_index
      --loglevel=INFO
      --concurrency=1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - BATCH_OCR_SERVICE_URL=${BATCH_OCR_SERVICE_URL}
      - BATCH_OCR_API_KEY=${BATCH_OCR_API_KEY}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - OPENSEARCH_URL=http://kalanjiyam-search:9200
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
      - kalanjiyam-search
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kalanjiyam-celery-batch:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-batch-dev
    command: >
      celery -A kalanjiyam.tasks worker
      -Q s3_batch
      --loglevel=INFO
      --concurrency=1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - BATCH_OCR_SERVICE_URL=${BATCH_OCR_SERVICE_URL}
      - BATCH_OCR_API_KEY=${BATCH_OCR_API_KEY}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OpenSearch (Lucene) backing the full-text search index.
  # Not published to the host: reachable only from the compose network.
  kalanjiyam-search:
    build:
      context: ../..
      dockerfile: build/containers/Dockerfile.opensearch
    container_name: kalanjiyam-search-dev
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - kalanjiyam-search-data:/usr/share/opensearch/data

  # S3-compatible gateway over a plain directory (Versity Gateway).
  kalanjiyam-versitygw:
    image: versity/versitygw:latest
    container_name: kalanjiyam-versitygw-dev
    environment:
      - ROOT_ACCESS_KEY=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - ROOT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - VGW_PORT=:7070
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARGS=--sidecar /metadata /data
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}:/data
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}-metadata:/metadata

volumes:
  kalanjiyam-data:
  kalanjiyam-search-data:
