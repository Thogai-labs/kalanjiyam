version: '3.8'

services:
  kalanjiyam-web:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-web-dev
    ports:
      - host_ip: ${KALANJIYAM_HOST_IP}
        published: ${KALANJIYAM_HOST_PORT:-5001}
        target: 5000
    volumes:
      - ${PWD}/kalanjiyam/static/:/app/kalanjiyam/static/
      - ${HOME}/kalanjiyam-data/uploads:/data/uploads
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:kalanjiyam@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam-dev-secret}
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kalanjiyam-db:
    image: postgres:15
    container_name: kalanjiyam-db-dev
    environment:
      - POSTGRES_DB=kalanjiyam
      - POSTGRES_USER=kalanjiyam
      - POSTGRES_PASSWORD=kalanjiyam
    volumes:
      - kalanjiyam-data:/var/lib/postgresql/data

  kalanjiyam-redis:
    image: redis:7
    container_name: kalanjiyam-redis-dev

  kalanjiyam-celery:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-dev
    command: >
      celery -A kalanjiyam.tasks worker
      -Q default,ocr,low_priority
      --loglevel=INFO
      --concurrency=1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:kalanjiyam@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - BATCH_OCR_SERVICE_URL=${BATCH_OCR_SERVICE_URL}
      - BATCH_OCR_API_KEY=${BATCH_OCR_API_KEY}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kalanjiyam-celery-batch:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-batch-dev
    command: >
      celery -A kalanjiyam.tasks worker
      -Q s3_batch
      --loglevel=INFO
      --concurrency=1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:kalanjiyam@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - BATCH_OCR_SERVICE_URL=${BATCH_OCR_SERVICE_URL}
      - BATCH_OCR_API_KEY=${BATCH_OCR_API_KEY}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # S3-compatible gateway over a plain directory (Versity Gateway).
  # Files remain ordinary files on the volume; the app talks S3.
  kalanjiyam-versitygw:
    image: versity/versitygw:latest
    container_name: kalanjiyam-versitygw-dev
    environment:
      - ROOT_ACCESS_KEY=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - ROOT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam-dev-secret}
      - VGW_PORT=:7070
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARGS=--sidecar /metadata /data
    volumes:
      - kalanjiyam-objects:/data
      - kalanjiyam-metadata:/metadata

volumes:
  kalanjiyam-data:
  kalanjiyam-objects:
  kalanjiyam-metadata:
