version: '3.8'

services:
  kalanjiyam-web:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-web-staging
    restart: unless-stopped
    ports:
      - host_ip: ${KALANJIYAM_HOST_IP}
        published: ${KALANJIYAM_STAGING_HOST_PORT:-5001}
        target: 5000
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - BHARATGEN_TRANSLATION_API_URL=${BHARATGEN_TRANSLATION_API_URL}
      - BHARATGEN_TRANSLATION_API_KEY=${BHARATGEN_TRANSLATION_API_KEY}
      - GUNICORN_TIMEOUT=300
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - OPENSEARCH_URL=http://kalanjiyam-search:9200
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
      - kalanjiyam-search
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kalanjiyam-db:
    image: postgres:15
    container_name: kalanjiyam-db-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kalanjiyam
      - POSTGRES_USER=kalanjiyam
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kalanjiyam}
    volumes:
      - kalanjiyam-data:/var/lib/postgresql/data

  kalanjiyam-redis:
    image: redis:7
    container_name: kalanjiyam-redis-staging
    restart: unless-stopped

  # Core Celery worker for housekeeping and search indexing
  kalanjiyam-celery:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-staging
    restart: unless-stopped
    command: >
      celery -A kalanjiyam.tasks worker
      -Q default,search_index
      --loglevel=INFO
      --autoscale=4,1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - BHARATGEN_TRANSLATION_API_URL=${BHARATGEN_TRANSLATION_API_URL}
      - BHARATGEN_TRANSLATION_API_KEY=${BHARATGEN_TRANSLATION_API_KEY}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - OPENSEARCH_URL=http://kalanjiyam-search:9200
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
      - kalanjiyam-search
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # PDF and document pre-processing worker (CPU/Memory intensive, isolated)
  kalanjiyam-celery-pdf:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-pdf-staging
    restart: unless-stopped
    command: >
      celery -A kalanjiyam.tasks worker
      -Q pdf_processing
      --loglevel=INFO
      --autoscale=4,1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - OPENSEARCH_URL=http://kalanjiyam-search:9200
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
      - kalanjiyam-search
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OCR worker (live editor OCR, enhanced OCR, comparisons)
  kalanjiyam-celery-ocr:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-ocr-staging
    restart: unless-stopped
    command: >
      celery -A kalanjiyam.tasks worker
      -Q ocr,low_priority
      --loglevel=INFO
      --autoscale=8,2
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Translation worker (page, revision, and UI batch translation)
  kalanjiyam-celery-translation:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-translation-staging
    restart: unless-stopped
    command: >
      celery -A kalanjiyam.tasks worker
      -Q translation
      --loglevel=INFO
      --autoscale=8,2
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - BHARATGEN_TRANSLATION_API_URL=${BHARATGEN_TRANSLATION_API_URL}
      - BHARATGEN_TRANSLATION_API_KEY=${BHARATGEN_TRANSLATION_API_KEY}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kalanjiyam-celery-batch:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-batch-staging
    restart: unless-stopped
    command: >
      celery -A kalanjiyam.tasks worker
      -Q s3_batch
      --loglevel=INFO
      --concurrency=1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - BHARATGEN_TRANSLATION_API_URL=${BHARATGEN_TRANSLATION_API_URL}
      - BHARATGEN_TRANSLATION_API_KEY=${BHARATGEN_TRANSLATION_API_KEY}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Archival metadata extraction. Its own worker, not a queue added to the two
  # above: a full-text pass is 10-20 minutes of continuous GPU per document, so
  # on the `ocr` queue it would starve live OCR and on `s3_batch` it would stall
  # batch OCR behind it. Without a worker consuming `metadata`, an extraction
  # enqueues successfully and then never runs.
  kalanjiyam-celery-metadata:
    image: ${KALANJIYAM_IMAGE}
    container_name: kalanjiyam-celery-metadata-staging
    restart: unless-stopped
    command: >
      celery -A kalanjiyam.tasks worker
      -Q metadata
      --loglevel=INFO
      --concurrency=1
      --prefetch-multiplier=1
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-staging}
      - REDIS_URL=redis://kalanjiyam-redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://kalanjiyam:${POSTGRES_PASSWORD:-kalanjiyam}@kalanjiyam-db/kalanjiyam
      - OCR_BACKEND=remote
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL}
      - TRANSLATION_SERVICE_API_KEY=${TRANSLATION_SERVICE_API_KEY}
      - BHARATGEN_TRANSLATION_API_URL=${BHARATGEN_TRANSLATION_API_URL}
      - BHARATGEN_TRANSLATION_API_KEY=${BHARATGEN_TRANSLATION_API_KEY}
      - FLASK_UPLOAD_FOLDER=/data/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://kalanjiyam-versitygw:7070
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - OPENSEARCH_URL=http://kalanjiyam-search:9200
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}/uploads:/data/uploads
    depends_on:
      - kalanjiyam-db
      - kalanjiyam-redis
      - kalanjiyam-versitygw
      - kalanjiyam-search
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OpenSearch (Lucene) backing the full-text search index.
  # Not published to the host: reachable only from the compose network.
  kalanjiyam-search:
    build:
      context: ../..
      dockerfile: build/containers/Dockerfile.opensearch
    container_name: kalanjiyam-search-staging
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - kalanjiyam-search-data:/usr/share/opensearch/data

  # S3-compatible gateway (Versity Gateway)
  kalanjiyam-versitygw:
    image: versity/versitygw:latest
    container_name: kalanjiyam-versitygw-staging
    restart: unless-stopped
    environment:
      - ROOT_ACCESS_KEY=${S3_ACCESS_KEY_ID:-kalanjiyam}
      - ROOT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-kalanjiyam}
      - VGW_PORT=:7070
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARGS=--sidecar /metadata /data
    volumes:
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}:/data
      - ${KALANJIYAM_DATA_DIR:-${HOME}/kalanjiyam-data}-metadata:/metadata

volumes:
  kalanjiyam-data:
  kalanjiyam-search-data:
